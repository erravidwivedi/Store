hree sisters, and one brother—where simplicity, prayer, and care for one another shaped our everyday life."}, {"t": "Learning without becoming a burden", "d": "Every step of my education and every certification was made possible through education loans and working alongside my studies. That journey taught me dignity, self-reliance, and the quiet strength of consistent effort."}, {"t": "The responsibility of an elder son", "d": "As the elder son, I actively share my family's responsibilities. Professional progress, for me, is not only personal achievement—it is a way to give stability, gratitude, and opportunity back to the people who raised me."}]}, {"k": "text", "h": "In my own words", "it": ["I was born in Charwa, a small village in Kaushambi district of Uttar Pradesh. My father is a priest who worships Lord Krishna and Radha, and our family has always been simple, innocent and rooted in Vedic traditions. I grew up with my three sisters, my brother and my grandparents.", "As the elder son, I have always taken an active part in my family's responsibilities. I worked hard to continue my study. ", "I just want to give my family a better life which they actually deserves so that one day they will feel proud on me."]}], "nv": "My story"}, {"id": "per", "bg": "b", "e": "PERSONAL LIFE", "t": "The person behind the profile.", "sub": "Grounded in a small-town upbringing and still driven by the same work ethic: show up, learn, and deliver.", "ic": "♥", "ph": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAIwAaQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi
